name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Format, build, unit and integration tests
        run: cd java && ./mvnw -B spotless:check verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: java/target/site/jacoco
          if-no-files-found: ignore
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: java/target/failsafe-reports
          if-no-files-found: ignore

  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Same command as /verify: warnings fail the job too.
      - name: Lint the OpenAPI contract
        run: npx -y @stoplight/spectral-cli@6 lint --fail-severity=warn java/src/main/resources/openapi/openapi.yaml

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Static analysis dry run
        run: cd java && ./mvnw -B -Psanitize rewrite:dryRun

  guardrails:
    runs-on: ubuntu-latest
    steps:
      # The commit message check walks history from a fixed base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository guard rails
        run: scripts/guardrails.sh

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Mutation testing of domain and application
        run: cd java && ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports
          path: java/target/pit-reports
          if-no-files-found: ignore
