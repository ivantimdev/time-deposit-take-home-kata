<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XA Bank Time Deposits API</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/swagger-ui.css">
</head>
<body>
<!-- ASSUMPTION A20: Swagger UI renders the static contract; nothing introspects the code. -->
<div id="swagger-ui"></div>
<script src="/webjars/swagger-ui/swagger-ui-bundle.js"></script>
<script src="/webjars/swagger-ui/swagger-ui-standalone-preset.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: "/openapi.yaml",
    dom_id: "#swagger-ui",
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    layout: "StandaloneLayout"
  });
</script>
</body>
</html>
