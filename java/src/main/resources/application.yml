spring:
  application:
    name: time-deposit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timedeposit}
    username: ${DB_USER:timedeposit}
    password: ${DB_PASSWORD:timedeposit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      # ASSUMPTION A20: the contract is served unchanged at /openapi.yaml, next to Spring's defaults.
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,classpath:/openapi/

server:
  port: 8080
